<div class="dashboard-container">
     <ng-container *ngIf="generalAnalysis && isAnalysisLoaded">
        <!-- CARDS MÉTRICOS -->
        <div class="cards-grid">
            <app-metric-card 
                *ngFor="let card of infoCards" 
                [title]="card.title" 
                [subtitle]="card.subtitle">
            </app-metric-card>
        </div>
        <!-- GRÁFICOS -->
        <div class="charts-grid">
                <app-pie-chart [data]="generalAnalysis.classificacoes"></app-pie-chart>
                <app-bar-chart [data]="generalAnalysis.tipoTransacao"></app-bar-chart>
        </div>
    </ng-container>
    <!-- LISTAGEM DE EMPRESAS -->
    <div class="companies-grid" *ngIf="companies && isCompaniesLoaded">
        <app-company-list [data]="companies"></app-company-list>
    </div>
</div>
