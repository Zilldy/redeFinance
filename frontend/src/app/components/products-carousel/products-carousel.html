<div class="carousel-container" *ngIf="replyProducts.length > 0; else noData">
  <!-- título fixo -->
  <h5 class="title mb-3">Recomendações de Produtos IA</h5>

  <!-- apenas a descrição troca -->
  <div class="carousel-item">
    <h5 class="title text-center">{{ replyProducts[currentIndex].product }}</h5>
    <p class="desc">{{ replyProducts[currentIndex].why }}</p>
  </div>

  <div class="carousel-controls">
    <button (click)="prev()">&#9664; Anterior</button>
    <span>{{ currentIndex + 1 }} / {{ replyProducts.length }}</span>
    <button (click)="next()">Próximo &#9654;</button>
  </div>
</div>

<ng-template #noData>
  <p class="text-muted">Nenhuma recomendação disponível.</p>
</ng-template>
