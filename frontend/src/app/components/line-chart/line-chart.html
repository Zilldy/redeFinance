<div class="chart-card">
    <div class="chart-header">
        <h3 class="chart-title">Acompanhamento Econômico da Empresa</h3>
        <div class="date-filter">
            <input 
                type="date" 
                [(ngModel)]="startDate" 
                (change)="onDateRangeChange()"
                class="date-input">
            <span class="date-separator">até</span>
            <input 
                type="date" 
                [(ngModel)]="endDate" 
                (change)="onDateRangeChange()"
                class="date-input">
        </div>
    </div>
    <div class="chart-container" *ngIf="isBrowser">
        <canvas
            baseChart
            [data]="lineChartData"
            [options]="lineChartOptions"
            [type]="'line'">
        </canvas>
    </div>
</div>
